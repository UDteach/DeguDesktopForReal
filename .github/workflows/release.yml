name: Build and publish desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Mac (Intel and Apple Silicon)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: |
            release-build/*.dmg
            release-build/*.zip
            release-build/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' files < <(find installers -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Degu Desktop for Real $GITHUB_REF_NAME" --notes "Mac（macOS 12以降、Intel・Apple Silicon）と Windows 向けのデスクトップ版。13の毛色と各3つの動きを収録。毛色は1色・複数色・全色ランダムから選べます。壁紙を変更せず、透明なクリック透過ウィンドウで表示します。"
          fi
